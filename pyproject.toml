[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-platform"
version = "0.2.0"
description = "Tenant-isolated retrieval and persistent usage governance"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0", "starlette==1.8.0", "uvicorn[standard]==0.34.2",
  "pydantic-settings==2.9.1", "qdrant-client==1.14.2",
  "redis==6.1.0", "SQLAlchemy==2.0.41", "psycopg[binary]==3.2.9",
  "httpx==0.28.1", "prometheus-client==0.22.0", "pypdf==6.20.1",
]
[project.optional-dependencies]
models = ["sentence-transformers==4.1.0"]
test = ["pytest==9.1.1", "fakeredis[lua]==2.29.0", "ruff==0.11.13"]
[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
